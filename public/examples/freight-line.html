  :root{

  body{

    font-variant-ligatures:none;

  .frame{ position:fixed; inset:0; overflow:hidden; background:#0a0b0c }

  video.bg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center; background:#0a0b0c;

  .tint{

      rgba(0,0,0,0.079) 29%,
      rgba(0,0,0,0.014) 37.5%,
      rgba(0,0,0,0.016) 46%,
      rgba(0,0,0,0.043) 55%,

      rgba(0,0,0,0.062) 73%,
      rgba(0,0,0,0.080) 81%,
      rgba(0,0,0,0.090) 90%,
      rgba(0,0,0,0.095) 100%

  }

  .stage{
    position:absolute; left:50%; top:50%;
    width:1280px; height:800px;
    margin:-400px 0 0 -640px;
    transform:scale(var(--s)); transform-origin:50% 50%;

  .eyebrow{

  .headline .hl3{ top:187.97px; letter-spacing:-0.237px; left:1.8px; text-indent:-0.237px }

  .f-right{ text-align:left; left:748.5px }

  /* ENTRANCE ANIMATION */
  @media (prefers-reduced-motion:no-preference){
    .eyebrow{ animation: riseIn 0.55s cubic-bezier(.33,.9,.35,1) 0.15s both }
    @keyframes riseIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

    .headline span{ animation: lineIn 0.9s cubic-bezier(.16,1,.3,1) both }
    .headline .hl1{ animation-delay:.28s }
    .headline .hl2{ animation-delay:.37s }
    .headline .hl3{ animation-delay:.46s }
    .headline .hl4{ animation-delay:.55s }
    @keyframes lineIn {
      0%   { opacity:0; transform:translateY(.26em); clip-path:inset(100% -30% 0% -30%) }
      35%  { opacity:1 }
      90%  { clip-path:inset(0% -30% -100% -30%) }
      100% { opacity:1; transform:none; clip-path:inset(-80% -30% -100% -30%) }
    }

    .mark{ animation: markIn 0.7s cubic-bezier(.2,.9,.25,1) 0.72s both }
    @keyframes markIn { from { opacity:0; transform:scale(.88) } to { opacity:1; transform:none } }

    .f-left{ animation: blockInL 0.75s cubic-bezier(.16,1,.3,1) 0.82s both }
    .f-right{ animation: blockInR 0.75s cubic-bezier(.16,1,.3,1) 0.90s both }
    @keyframes blockInL { from { opacity:0; transform:translate(-12px,8px) } to { opacity:1; transform:none } }
    @keyframes blockInR { from { opacity:0; transform:translate( 12px,8px) } to { opacity:1; transform:none } }

  /* PHONE */
  @media (max-width:609px){
    .frame{ height:100vh; height:100dvh }

    .stage{
      position:absolute; inset:0; width:auto; height:auto; margin:0; transform:none;

      grid-template-columns: 100%;
      grid-template-rows: auto auto 1fr auto auto auto minmax(0,.3fr);

    }
    .eyebrow,.headline,.feature,.feature h2,.feature p,.feature .icon{ position:static; width:auto }

    .eyebrow{
      grid-row: 1;
      font-size:clamp(8px, calc(9.5 * var(--u)), 11px);
      letter-spacing:.304em; text-indent:.304em; word-spacing:.07em;
      margin-bottom:calc(16 * var(--u));

    .headline{
      grid-row: 2;
      font-size:clamp(26px, min(11.6vw, calc(52 * var(--u))), 64px);

    }
    .headline span{ letter-spacing:-.012em; position:static; width:auto; top:auto; left:auto; text-indent:0 }
    .mark{ position:static; left:auto; top:auto }

    .mark{
      grid-row: 4; justify-self:center; right:5%;
      width:clamp(38px, calc(46 * var(--u)), 54px); height:clamp(38px, calc(46 * var(--u)), 54px);
      margin-bottom:calc(18 * var(--u));

    .f-left{ grid-row: 5; margin-bottom:calc(26 * var(--u)); text-align:right }
    .f-right{ grid-row: 6; text-align:left }

    .feature .icon{
      display:block;
      width:clamp(26px, calc(34 * var(--u)), 40px);
      height:clamp(28px, calc(37 * var(--u)), 43px);
    }
    .f-left .icon{ margin-left:auto; margin-right:calc(-4 * var(--u)) }
    .f-right .icon{ margin-right:auto; margin-left:calc(-3 * var(--u)) }

    .feature h2{
      font-size:clamp(15px, calc(17 * var(--u)), 20px); line-height:1.08;
    }
    .feature p{
      font-size:clamp(11.5px, calc(13.5 * var(--u)), 14.5px); line-height:1.36;

    }
    .f-left p{ margin-left:auto }
    .f-right p{ margin-right:auto }
  }
